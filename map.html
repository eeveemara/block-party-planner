<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Our notebook map | Rust in Peace</title>
<style>
:root{--bg:#FAF8F3;--ink:#22252B;--muted:#6B6F76;--line:#E2DCCF;--rust:#A8481B;--teal:#1F7A72;--yellow:#FFCD00}
*{box-sizing:border-box}
html,body{margin:0;height:100%;overflow:hidden;background:var(--bg);color:var(--ink);
  font-family:"Segoe UI",system-ui,-apple-system,Roboto,"Helvetica Neue",Arial,sans-serif;font-feature-settings:"calt" 0}
#view{position:fixed;inset:0;touch-action:none;cursor:grab}
#view.drag{cursor:grabbing}
#world{position:absolute;left:0;top:0;transform-origin:0 0;will-change:transform}
#edges{position:absolute;left:0;top:0;overflow:visible;pointer-events:none}

header{position:fixed;left:16px;top:12px;z-index:5;display:flex;align-items:center;gap:10px;pointer-events:none}
header img{height:34px;width:auto}
header .t1{font-weight:700;font-size:18px}
header .t2{font-size:12.5px;color:var(--muted)}

#tools{position:fixed;right:12px;top:12px;z-index:5;display:flex;gap:6px;flex-wrap:wrap;justify-content:flex-end}
.tb{height:32px;padding:0 11px;border-radius:7px;border:1px solid var(--line);background:#fff;color:var(--ink);
  font:600 13px/1 inherit;font-family:inherit;cursor:pointer}
.tb:hover{border-color:#bdb3a0}
.tb.sq{width:32px;padding:0;font-size:16px}
.tb.on{background:var(--yellow);border-color:#e0b400}
#search{height:32px;width:140px;border-radius:7px;border:1px solid var(--line);padding:0 10px;font:13px inherit;font-family:inherit;background:#fff;outline:none}
#search:focus{border-color:var(--teal)}

.node{position:absolute;left:0;top:0;width:max-content;user-select:none;-webkit-user-select:none}
.node.gone{pointer-events:none}
.card{position:relative;display:flex;align-items:center;gap:9px;background:#fff;border:1px solid var(--line);
  border-left:4px solid var(--c);border-radius:8px;padding:7px 10px}
.clickable .card{cursor:pointer}
.clickable .card:hover{border-color:var(--c)}
.ph{flex:0 0 auto;width:48px;height:48px;border-radius:6px;object-fit:cover;display:block}
.txt{min-width:0}
.ttl{font-weight:600;font-size:13.5px;line-height:1.3}
.sub{font-size:12px;color:var(--muted);line-height:1.35;margin-top:1px}
.tag{display:inline-block;font-size:10px;font-weight:700;letter-spacing:.04em;border-radius:4px;padding:1px 5px;margin-right:5px;vertical-align:1px;
  border:1px solid var(--c);color:var(--c)}
.dchip{display:inline-block;background:var(--yellow);color:#3a3000;font-weight:700;font-size:10.5px;border-radius:4px;padding:1px 6px;margin-top:4px}
.st{display:inline-block;font-weight:700;font-size:10.5px;border-radius:4px;padding:1px 6px;margin-left:6px;vertical-align:1px}
.st.met{background:#DCEFEC;color:#14594F}.st.closed{background:#FFF1BF;color:#7A5C00}

.d0 .card{border:2px solid var(--ink);border-radius:10px;padding:10px 14px 10px 10px}
.d0 .ph{width:64px;height:64px;object-fit:contain}
.d0 .ttl{font-size:20px;font-weight:800}
.d1 .card{border-left-width:6px;padding:9px 12px}
.d1 .ttl{font-size:15px;font-weight:700}
.d1 .ph{width:56px;height:56px}
.d3 .card,.d4 .card{padding:5px 9px}
.d3 .ttl,.d4 .ttl{font-size:12.5px;font-weight:500}
.d3 .ph,.d4 .ph{width:40px;height:40px}
.play{flex:0 0 auto;width:22px;height:22px;border-radius:50%;background:var(--rust);display:grid;place-items:center}
.play svg{width:10px;height:10px;fill:#fff;margin-left:2px}

.go{flex:0 0 auto;font-size:13px;font-weight:700;color:var(--c);text-decoration:none;padding:2px 5px;border-radius:5px;margin-left:2px}
.go:hover{background:#F2EEE6}
.tog{position:absolute;right:-12px;top:50%;transform:translateY(-50%);min-width:20px;height:20px;padding:0 4px;border-radius:10px;
  background:#fff;border:1.5px solid var(--c);color:var(--c);font:700 11px/17px inherit;font-family:inherit;text-align:center;cursor:pointer}
.open>.card>.tog{background:var(--c);color:#fff}
.chart{margin-top:6px}
.chart svg{display:block}
.chart text{font-family:inherit}

body.dmode .node:not(.hasd)>.card{opacity:.25}
.node.hit .card{outline:2px solid var(--yellow);outline-offset:2px}
.node.flash .card{animation:flash 1.1s ease 2}
@keyframes flash{50%{outline:4px solid var(--yellow);outline-offset:3px}}
.hint{position:fixed;left:16px;bottom:10px;font-size:12px;color:var(--muted);z-index:5;pointer-events:none}

@media (max-width:760px){
  header{left:10px;top:8px} header img{height:26px} header .t1{font-size:15px} header .t2{display:none}
  #tools{top:auto;bottom:10px;left:8px;right:8px;justify-content:center}
  #search{width:110px}
  .hint{display:none}
}
</style>
</head>

function chart(kind){
 const W=230, T='#1F7A72', R='#A8481B', G='#C9C2B4';
 const bars=(rows,max,lw,unit,h)=>{ let s='<svg width="'+W+'" height="'+(rows.length*19+(h||2))+'">';
  rows.forEach((r,i)=>{const y=i*19,w=Math.max(3,r[1]/max*130);
   s+='<text x="0" y="'+(y+12)+'" font-size="10.5" fill="#6B6F76">'+r[0]+'</text><rect x="'+lw+'" y="'+(y+3)+'" width="'+w+'" height="11" rx="2" fill="'+r[2]+'"/><text x="'+(lw+w+5)+'" y="'+(y+12)+'" font-size="10.5" font-weight="700" fill="#22252B">'+(r[3]||r[1]+unit)+'</text>';});
  return s; };
 if(kind==='runs'){ let s=bars([['Thu, run 1',450,R,'7:30'],['Thu, run 2',240,R,'4:00'],['Sat, run 3',155,T,'2:35'],['Sat, run 4',120,T,'2:00'],['Sat, final',92,T,'1:32']],450,62,'',16);
  return s+'<text x="0" y="107" font-size="10" fill="'+R+'">rubber bands</text><text x="80" y="107" font-size="10" fill="'+T+'">spiral chuck + planner</text></svg>'; }
 if(kind==='squeeze'){ let s=bars([['V3',2,G],['Rack',12,R],['Chuck',14,T]],14,42,' N',18); const x=42+1.8/14*130;
  return s+'<line x1="'+x+'" y1="0" x2="'+x+'" y2="58" stroke="#22252B" stroke-width="1" stroke-dasharray="2 2"/><text x="'+(x+3)+'" y="70" font-size="10" fill="#6B6F76">1.8 N needed</text></svg>'; }
 if(kind==='permove') return bars([['Rubber bands',64,R],['Chuck',18,T]],64,74,' s')+'</svg>';
 if(kind==='goals'){ let s='<svg width="'+W+'" height="22">'; for(let i=0;i<7;i++) s+='<rect x="'+(i*22)+'" y="3" width="18" height="16" rx="3" fill="'+(i===4?'#FFCD00':T)+'"/><text x="'+(i*22+9)+'" y="15" text-anchor="middle" font-size="9.5" font-weight="700" fill="'+(i===4?'#3a3000':'#fff')+'">G'+(i+1)+'</text>';
  return s+'<text x="160" y="15" font-size="11" fill="#22252B"><tspan font-weight="700">6</tspan> met, <tspan font-weight="700">1</tspan> closed</text></svg>'; }
 return '';
}

 else if(d.k==='vid') h+='<div class="play"><svg viewBox="0 0 10 10"><polygon points="0,0 9,5 0,10"/></svg></div>';
 const maxw=d.depth===0?300:d.chart?240:220;
 h+='<div class="txt" style="max-width:'+maxw+'px"><div class="ttl">'+(d.tag?'<span class="tag">'+d.tag+'</span>':'')+esc(d.t)+(d.st?'<span class="st '+d.st+'">'+(d.st==='met'?'Met':'Closed')+'</span>':'')+'</div>';
 if(d.s) h+='<div class="sub">'+esc(d.s)+'</div>';
 if(d.d) h+='<span class="dchip">Deliverable '+d.d+'</span>';

 if(d.c.length) h+='<div class="tog"></div>';
 h+='</div>';
 el.innerHTML=h; d.el=el; world.appendChild(el);
 const card=el.firstChild;
 card.addEventListener('click',e=>{ if(moved) return; if(e.target.closest('.go')) return;
  if(d.c.length) toggle(d); else if(d.l) window.open(d.l,'_blank','noopener'); });
 card.addEventListener('keydown',e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();card.click();}});
 const p=document.createElementNS('http://www.w3.org/2000/svg','path'); p.setAttribute('fill','none'); d.path=p; if(d.parent) edges.appendChild(p);
});
function measure(){ all.forEach(d=>{ d.w=d.el.firstChild.offsetWidth; d.h=d.el.firstChild.offsetHeight; }); }
function setTog(d){ if(!d.c.length) return; const t=d.el.querySelector('.tog'); t.textContent=d.open?'−':d.c.length; d.el.classList.toggle('open',d.open); }

/* ---------- layout ---------- */
const GX=58;
function visible(d){ let p=d.parent; while(p){ if(!p.open) return false; p=p.parent;} return true; }
function shift(d,dy){ d.ty+=dy; if(d.open) d.c.forEach(c=>shift(c,dy)); }
function lay(d,x,y0){
 d.tx=x; d.to=1;
 const kids=d.open?d.c:[];
 if(!kids.length){ d.ty=y0; return d.h; }
 let y=y0; const cx=x+d.w+GX;
 kids.forEach((c,i)=>{ const hh=lay(c,cx,y); const big=c.open&&c.c.length; y+=hh+(big|| (kids[i+1]&&kids[i+1].open)? 22:10); });
 let total=y-y0-10;
 const first=kids[0], last=kids[kids.length-1];
 let mid=((first.ty+first.h/2)+(last.ty+last.h/2))/2;
 let top=mid-d.h/2;
 if(top<y0){ kids.forEach(c=>shift(c,y0-top)); total+=y0-top; top=y0; }
 if(top+d.h>y0+total){ total=top+d.h-y0; }
 d.ty=top; return total;
}
function hide(d){ d.c.forEach(c=>{ c.to=0; c.tx=d.tx+d.w-c.w*0.5; c.ty=d.ty+d.h/2-c.h/2; hide(c); }); }
function layout(){
 lay(DATA,0,0);
 (function walk(d){ if(d.open) d.c.forEach(walk); else hide(d); })(DATA);
 all.forEach(setTog);
}

/* ---------- view transform ---------- */
let k=1,px=0,py=0, tk=1,tpx=0,tpy=0;
function applyView(){ world.style.transform='translate('+px+'px,'+py+'px) scale('+k+')'; }
function bbox(){ let x0=1e9,y0=1e9,x1=-1e9,y1=-1e9; all.forEach(d=>{ if(d.to<.5) return; x0=Math.min(x0,d.tx); y0=Math.min(y0,d.ty); x1=Math.max(x1,d.tx+d.w+14); y1=Math.max(y1,d.ty+d.h); }); return {x0,y0,x1,y1}; }
function fitTarget(byWidth){
 const b=bbox(), vw=innerWidth, vh=innerHeight, mobile=vw<760;
 const top=mobile?64:76, bot=mobile?110:60, side=mobile?12:24;
 let kk=Math.min((vw-2*side)/(b.x1-b.x0),(vh-top-bot)/(b.y1-b.y0),1.15);
 if(byWidth && kk<0.55){ kk=Math.min((vw-2*side)/(b.x1-b.x0),0.8); }
 tk=Math.max(kk,0.12); tpx=side+((vw-2*side)-(b.x1-b.x0)*tk)/2-b.x0*tk;
 const hh=(b.y1-b.y0)*tk;
 tpy = hh<=vh-top-bot ? top+((vh-top-bot)-hh)/2-b.y0*tk : top-b.y0*tk;
}

/* ---------- animation ---------- */
let anim=null;
function animate(dur){
 const start=performance.now();
 const from=all.map(d=>[d.x,d.y,d.co]); const fv=[k,px,py];
 cancelAnimationFrame(anim);
 const step=t=>{
  let e=Math.min(1,(t-start)/dur); e=1-Math.pow(1-e,3);
  all.forEach((d,i)=>{ d.x=from[i][0]+(d.tx-from[i][0])*e; d.y=from[i][1]+(d.ty-from[i][1])*e; d.co=from[i][2]+(d.to-from[i][2])*e; });
  k=fv[0]+(tk-fv[0])*e; px=fv[1]+(tpx-fv[1])*e; py=fv[2]+(tpy-fv[2])*e;
  draw(); applyView();
  if(e<1) anim=requestAnimationFrame(step);
 };
 anim=requestAnimationFrame(step);
}
function draw(){
 all.forEach(d=>{
  const s=0.9+0.1*d.co;
  d.el.style.transform='translate('+d.x+'px,'+d.y+'px) scale('+s+')';
  d.el.style.opacity=d.co; d.el.classList.toggle('gone',d.co<.5);
  d.el.style.visibility=d.co<.01?'hidden':'visible';
  if(d.parent){
   const p=d.parent, x1=p.x+p.w+(p.c.length?12:0), y1=p.y+p.h/2, x2=d.x, y2=d.y+d.h/2*s, mx=(x1+x2)/2;
   d.path.setAttribute('d','M'+x1+','+y1+' C'+mx+','+y1+' '+mx+','+y2+' '+x2+','+y2);
   d.path.setAttribute('stroke',d.col);
   d.path.setAttribute('stroke-width',d.depth===1?2.4:1.5);
   d.path.setAttribute('stroke-opacity',.5*d.co);
  }
 });
}

/* ---------- actions ---------- */
function anchorTo(d){ // keep node d in the same place on screen
 const sx=px+d.x*k, sy=py+d.y*k; tk=k; tpx=sx-d.tx*k; tpy=sy-d.ty*k;
}
function toggle(d){
 d.open=!d.open;
 if(!d.open) (function close(x){ x.c.forEach(c=>{c.open=false;close(c);}); })(d);
 layout(); anchorTo(d); keepInView(d); animate(420);
}
function keepInView(d){
 // after opening, nudge so the opened subtree fits on screen if possible
 if(!d.open) return;
 let y0=d.ty,y1=d.ty+d.h,x1=d.tx+d.w;
 (function w(x){ if(!x.open) return; x.c.forEach(c=>{ y0=Math.min(y0,c.ty); y1=Math.max(y1,c.ty+c.h); x1=Math.max(x1,c.tx+c.w+14); w(c); }); })(d);
 const vh=innerHeight, vw=innerWidth, top=70, bot=60;
 const sy0=tpy+y0*tk, sy1=tpy+y1*tk, sx1=tpx+x1*tk;
 if(sy1-sy0 < vh-top-bot){ if(sy0<top) tpy+=top-sy0; else if(sy1>vh-bot) tpy-=sy1-(vh-bot); }
 else tpy+=top-sy0;
 if(sx1>vw-20){ const need=sx1-(vw-20); const sx0=tpx+d.tx*tk; tpx-=Math.min(need,Math.max(0,sx0-20)); }
}
function setAll(open){ all.forEach(d=>{ if(d.c.length) d.open=open||d.depth===0; }); layout(); fitTarget(open); animate(520); }
function zoomAt(f,cx,cy){ const nk=Math.min(3,Math.max(.12,k*f)); px=cx-(cx-px)*nk/k; py=cy-(cy-py)*nk/k; k=nk; tk=k;tpx=px;tpy=py; applyView(); }

document.getElementById('bE').onclick=()=>setAll(true);
document.getElementById('bC').onclick=()=>{ setAll(false); };
document.getElementById('bF').onclick=()=>{ fitTarget(); animate(450); };
document.getElementById('bI').onclick=()=>{ tk=Math.min(3,k*1.3); tpx=innerWidth/2-(innerWidth/2-px)*tk/k; tpy=innerHeight/2-(innerHeight/2-py)*tk/k; animate(250); };
document.getElementById('bO').onclick=()=>{ tk=Math.max(.12,k/1.3); tpx=innerWidth/2-(innerWidth/2-px)*tk/k; tpy=innerHeight/2-(innerHeight/2-py)*tk/k; animate(250); };
const bD=document.getElementById('bD');
bD.onclick=()=>{
 const on=!document.body.classList.contains('dmode');
 document.body.classList.toggle('dmode',on); bD.classList.toggle('on',on);
 if(on){ all.forEach(d=>{ if(d.d){ let p=d.parent; while(p){ p.open=true; p=p.parent; } } }); layout(); fitTarget(true); animate(500); }
};

/* search */
const q=document.getElementById('search'); let hits=[],hi=-1;
q.addEventListener('input',()=>{
 const v=q.value.trim().toLowerCase(); all.forEach(d=>d.el.classList.remove('hit'));
 hits=v.length<2?[]:all.filter(d=>(d.t+' '+(d.s||'')).toLowerCase().includes(v)); hi=-1;
 hits.forEach(d=>d.el.classList.add('hit'));
});
q.addEventListener('keydown',e=>{
 if(e.key!=='Enter'||!hits.length) return;
 hi=(hi+1)%hits.length; const d=hits[hi]; let p=d.parent; while(p){p.open=true;p=p.parent;}
 layout(); tk=Math.max(k,.85); tpx=innerWidth/2-(d.tx+d.w/2)*tk; tpy=innerHeight/2-(d.ty+d.h/2)*tk; animate(450);
 d.el.classList.remove('flash'); void d.el.offsetWidth; d.el.classList.add('flash');
});

/* pan and zoom */
const pts=new Map(); let moved=false, last=null, pinch=null;
view.addEventListener('pointerdown',e=>{
 if(e.target.closest('.go')) return;
 pts.set(e.pointerId,{x:e.clientX,y:e.clientY}); moved=false;
 if(pts.size===1) last={x:e.clientX,y:e.clientY};
 if(pts.size===2){ const a=[...pts.values()]; pinch={d:Math.hypot(a[0].x-a[1].x,a[0].y-a[1].y),cx:(a[0].x+a[1].x)/2,cy:(a[0].y+a[1].y)/2}; }
 cancelAnimationFrame(anim);
});
view.addEventListener('pointermove',e=>{
 if(!pts.has(e.pointerId)) return; pts.set(e.pointerId,{x:e.clientX,y:e.clientY});
 if(pts.size===1 && last){ const dx=e.clientX-last.x, dy=e.clientY-last.y; if(Math.abs(dx)+Math.abs(dy)>3||moved){ if(!moved){ try{view.setPointerCapture(e.pointerId);}catch(_){} } moved=true; view.classList.add('drag'); px+=dx; py+=dy; tpx=px;tpy=py; last={x:e.clientX,y:e.clientY}; applyView(); } }
 else if(pts.size===2 && pinch){ if(!moved){ try{[...pts.keys()].forEach(id=>view.setPointerCapture(id));}catch(_){} } moved=true; const a=[...pts.values()]; const dd=Math.hypot(a[0].x-a[1].x,a[0].y-a[1].y), cx=(a[0].x+a[1].x)/2, cy=(a[0].y+a[1].y)/2;
  px+=cx-pinch.cx; py+=cy-pinch.cy; zoomAt(dd/pinch.d,cx,cy); pinch={d:dd,cx,cy}; }
});
const up=e=>{ pts.delete(e.pointerId); if(pts.size<2) pinch=null; if(pts.size===1){ const a=[...pts.values()][0]; last={x:a.x,y:a.y}; } if(!pts.size){ view.classList.remove('drag'); last=null; setTimeout(()=>moved=false,0);} };
view.addEventListener('pointerup',up); view.addEventListener('pointercancel',up);
view.addEventListener('wheel',e=>{
 e.preventDefault(); cancelAnimationFrame(anim);
 const isMouse = e.deltaMode===1 || (e.deltaX===0 && Math.abs(e.deltaY)>=50 && Number.isInteger(e.deltaY));
 if(e.ctrlKey||isMouse){ zoomAt(Math.exp(-e.deltaY*(e.ctrlKey?0.01:0.0018)),e.clientX,e.clientY); }
 else { px-=e.deltaX; py-=e.deltaY; tpx=px;tpy=py; applyView(); }
},{passive:false});
addEventListener('keydown',e=>{ if(e.target===q) return; if(e.key==='f') document.getElementById('bF').click(); if(e.key==='+'||e.key==='=') document.getElementById('bI').click(); if(e.key==='-') document.getElementById('bO').click(); });
addEventListener('resize',()=>{ fitTarget(); animate(250); });

/* start */
function start(){
 measure(); DATA.open=true; layout();
 all.forEach(d=>{ d.x=d.tx; d.y=d.ty; d.co=d.to; });
 // start with branches drawn out from the root
 all.forEach(d=>{ if(d.depth>=1){ d.x=DATA.tx+DATA.w-d.w*.5; d.y=DATA.ty+DATA.h/2-d.h/2; d.co=0; } });
 fitTarget(); k=tk;px=tpx;py=tpy; draw(); applyView(); animate(700);
}
if(document.fonts&&document.fonts.ready) document.fonts.ready.then(start); else start();
})();
